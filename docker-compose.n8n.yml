services:
  n8n:
    image: n8nio/n8n:latest
    container_name: clientfinder_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
    volumes:
      - clientfinder_n8n_data:/home/node/.n8n

volumes:
  clientfinder_n8n_data:
