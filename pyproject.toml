[project]
name = "clientfinder"
version = "0.6.0"
description = "A focused lead discovery and qualification system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.8,<3.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
dashboard = ["streamlit>=1.40,<2.0", "pandas>=2.2,<3.0", "requests>=2.32,<3.0"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["dashboard*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
